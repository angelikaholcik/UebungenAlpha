<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Übung 31 – E/e und N/n finden</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f1e8;font-family:Arial,sans-serif}#game{padding:8px 12px 14px;min-height:100vh}.top{display:flex;gap:10px;align-items:center}.ctl{width:46px;height:46px;border:0;border-radius:14px;background:#fff;font-size:23px;box-shadow:0 2px 8px #bbb}.track{flex:1;height:16px;background:#ddd;border-radius:10px;overflow:hidden}.bar{height:100%;width:0;background:#444;transition:.2s}h1{text-align:center;font-size:clamp(25px,3.2vw,35px);margin:5px 0 7px}#board{position:relative;max-width:900px;height:360px;margin:auto;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 2px 8px #ddd}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;padding:14px;height:100%}.card{position:relative;border:0;border-radius:18px;background:#f3f3f3;font-size:52px;font-weight:700;cursor:pointer}.card.ok:after,.card.bad:after{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:900;background:rgba(255,255,255,.72);border-radius:16px}.card.ok:after{content:"✓";color:#16803a}.card.bad:after{content:"✕";color:#c62828}#finish{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:82px}#finish.show{display:flex}@media(max-width:650px){#board{height:335px}.grid{gap:7px;padding:10px}.card{font-size:44px}}</style></head>
<body><div id="game"><div class="top"><button id="reset" class="ctl">↺</button><div class="track"><div id="bar" class="bar"></div></div></div><h1 id="title"></h1><div id="board"><div id="finish">👏 🎉</div></div></div>
<script>(function(){var board=document.getElementById("board"),title=document.getElementById("title"),bar=document.getElementById("bar"),finish=document.getElementById("finish");
var rounds=[
{text:"Klick auf alle E und e.",targets:["E","e"],items:["E","m","e","A","N","E","r","e","L","a","E","n","R","e","M"]},
{text:"Klick auf alle N und n.",targets:["N","n"],items:["a","N","s","n","M","l","N","E","n","A","m","N","e","n","L"]},
{text:"Klick auf alle E und e.",targets:["E","e"],items:["n","L","E","m","e","A","N","e","M","l","E","a","r","e","S"]},
{text:"Klick auf alle N und n.",targets:["N","n"],items:["N","a","e","L","n","M","N","m","E","n","A","l","N","s","n"]},
{text:"Klick auf alle E und e.",targets:["E","e"],items:["A","m","N","e","L","E","a","n","e","M","E","l","S","e","R"]},
{text:"Klick auf alle N und n.",targets:["N","n"],items:["e","N","A","m","n","L","N","a","E","n","M","l","N","s","n"]}];
var round=0,found=0,needed=0;
function sh(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function clear(){Array.from(board.children).forEach(function(e){if(e!==finish)e.remove()})}
function render(){clear();finish.className="";found=0;var r=rounds[round];title.textContent=r.text;needed=r.items.filter(x=>r.targets.includes(x)).length;var g=document.createElement("div");g.className="grid";sh(r.items.slice()).forEach(function(letter){var b=document.createElement("button");b.className="card";b.textContent=letter;b.onclick=function(){if(b.disabled)return;if(r.targets.includes(letter)){b.classList.add("ok");b.disabled=true;found++;if(found===needed)setTimeout(next,500)}else{b.classList.add("bad");b.disabled=true;setTimeout(function(){b.classList.remove("bad");b.disabled=false},450)}};g.appendChild(b)});board.appendChild(g)}
function next(){round++;bar.style.width=(round/rounds.length*100)+"%";if(round>=rounds.length){clear();title.textContent="Super!";finish.className="show"}else render()}
document.getElementById("reset").onclick=function(){round=0;bar.style.width="0%";render()};render()})();</script></body></html>
