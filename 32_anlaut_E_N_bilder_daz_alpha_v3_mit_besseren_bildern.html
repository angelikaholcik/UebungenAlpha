<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Übung 32 – E oder N?</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1e8;font-family:Arial,sans-serif}
#game{padding:8px 12px 14px;min-height:100vh}
.top{display:flex;gap:10px;align-items:center}
.ctl{width:46px;height:46px;border:0;border-radius:14px;background:#fff;font-size:23px;box-shadow:0 2px 8px #bbb;cursor:pointer}
.track{flex:1;height:16px;background:#ddd;border-radius:10px;overflow:hidden}
.bar{height:100%;width:0;background:#444;transition:.2s}
h1{text-align:center;font-size:clamp(25px,3.2vw,36px);margin:5px 0 7px}
#board{position:relative;max-width:900px;height:390px;margin:auto;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 2px 8px #ddd}
.grid{height:100%;padding:12px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:9px}
.card{position:relative;border:0;border-radius:18px;background:#f3f3f3;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic{font-size:clamp(45px,6vw,68px);line-height:1;max-width:82%;max-height:82%}
.picimg{display:block;max-width:82%;max-height:82%;width:auto;height:auto;object-fit:contain}
.card.ok:after,.card.bad:after{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:66px;font-weight:900;background:rgba(255,255,255,.72)}
.card.ok:after{content:"✓";color:#16803a}
.card.bad:after{content:"✕";color:#c62828}
#finish{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:82px}
#finish.show{display:flex}


@media(max-width:600px){
 #board{height:350px}
 .grid{padding:9px;gap:6px}
 .pic{font-size:43px}
 
}
</style>
</head>

 "Löwe":'<span class="pic">🦁</span>',
 "Rad":'<span class="pic">🚲</span>'

var rounds=[
 {letter:"E",targets:["Esel","Erde","Erbse","Ente"],others:["Nest","Nase","Apfel","Maus","Rose","Ring","Lampe","Sofa"]},
 {letter:"N",targets:["Nest","Nagel","Nacht","Nase"],others:["Esel","Ente","Apfel","Maus","Rose","Ring","Löwe","Sofa"]},
 {letter:"E",targets:["Erdbeere","Elefant","Esel","Ente"],others:["Nadel","Nüsse","Nest","Nase","Milch","Rad","Rose","Lampe"]},
 {letter:"N",targets:["Nudeln","Nadel","Nüsse","Nest"],others:["Erde","Erbse","Erdbeere","Elefant","Apfel","Maus","Ring","Sofa"]},
 {letter:"E",targets:["Erde","Erbse","Erdbeere","Elefant","Ente"],others:["Nacht","Nagel","Nase","Nudeln","Rose","Maus","Rad"]},
 {letter:"N",targets:["Nest","Nagel","Nacht","Nudeln","Nadel","Nüsse","Nase"],others:["Esel","Erde","Ente","Erdbeere","Apfel"]}
];

var round=0,found=0;

function shuffle(a){
 for(var i=a.length-1;i>0;i--){
  var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;
 }
 return a;
}
function clearBoard(){
 Array.from(board.children).forEach(function(e){if(e!==finish)e.remove()});
}
function render(){
 clearBoard();
 finish.className="";
 found=0;
 var r=rounds[round];
 title.textContent=r.letter+" – Klick auf alle Bilder.";

 var grid=document.createElement("div");
 grid.className="grid";

 shuffle(r.targets.concat(r.others)).forEach(function(word){
  var b=document.createElement("button");
  b.className="card";
  b.type="button";
  b.innerHTML=P[word];
  b.setAttribute("aria-label",word);

  b.onclick=function(){
   if(b.disabled)return;
   if(r.targets.indexOf(word)>=0){
    b.classList.add("ok");
    b.disabled=true;
    found++;
    if(found===r.targets.length)setTimeout(next,550);
   }else{
    b.classList.add("bad");
    b.disabled=true;
    setTimeout(function(){
     b.classList.remove("bad");
     b.disabled=false;
    },450);
   }
  };
  grid.appendChild(b);
 });

 board.appendChild(grid);
}
function next(){
 round++;
 bar.style.width=(round/rounds.length*100)+"%";
 if(round>=rounds.length){
  clearBoard();
  title.textContent="Super!";
  finish.className="show";
 }else render();
}
function restart(){
 round=0;
 bar.style.width="0%";
 render();
}
document.getElementById("reset").onclick=restart;
restart();
})();
