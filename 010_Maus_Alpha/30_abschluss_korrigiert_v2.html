<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Übung 30 – Abschlussspiel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1e8;font-family:Arial,sans-serif}
#game{padding:8px 12px 14px;min-height:100vh}
.top{display:flex;gap:10px;align-items:center}
.ctl{width:46px;height:46px;border:0;border-radius:14px;background:#fff;font-size:23px;box-shadow:0 2px 8px #bbb;cursor:pointer}
.track{flex:1;height:16px;background:#ddd;border-radius:10px;overflow:hidden}
.bar{height:100%;width:0;background:#444;transition:.2s}
#title{text-align:center;font-size:clamp(24px,3vw,34px);margin:5px 0 5px;font-weight:700}
#prompt{text-align:center;font-size:clamp(28px,4.5vw,46px);font-weight:800;margin:0 0 8px;min-height:54px}
#board{position:relative;max-width:900px;height:425px;margin:auto;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 2px 8px #ddd}
.grid{height:100%;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:10px}
.card{position:relative;border:0;border-radius:18px;background:#f3f3f3;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px}
.card.word{font-size:clamp(22px,3vw,32px);font-weight:800}
.pic{font-size:clamp(46px,6vw,68px);line-height:1}
.realpic{display:block;max-width:80%;max-height:80%;width:auto;height:auto;object-fit:contain}
.card.ok:after,.card.bad:after{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:68px;font-weight:900;background:rgba(255,255,255,.76);border-radius:18px}
.card.ok:after{content:"✓";color:#16803a} .card.bad:after{content:"✕";color:#c62828}
.center{height:40%;display:flex;align-items:center;justify-content:center;padding:12px}
.picbox{width:270px;height:170px;border-radius:22px;background:#f3f3f3;display:flex;align-items:center;justify-content:center;overflow:hidden}
.answers{height:44%;display:flex;gap:16px;align-items:center;justify-content:center;padding:0 14px 14px}
.answer{position:relative;width:min(280px,42%);height:90px;border:0;border-radius:18px;background:#f3f3f3;font-size:clamp(28px,4vw,40px);font-weight:800;cursor:pointer}
.answer.ok:after,.answer.bad:after{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900;background:rgba(255,255,255,.78);border-radius:18px}
.answer.ok:after{content:"✓";color:#16803a} .answer.bad:after{content:"✕";color:#c62828}
.multi{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;max-width:92%}
.multi .pic{font-size:44px}.multi .realpic{max-width:68px;max-height:68px}
.apples{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-items:center;max-width:90%}
.apple{font-size:34px}.colorbox{width:230px;height:145px;border-radius:22px;border:4px solid #777}
.wordrow{height:34%;display:flex;align-items:center;justify-content:center;gap:7px;font-size:clamp(38px,5.5vw,58px);font-weight:800}
.letter{width:68px;height:74px;border:4px solid #777;border-radius:14px;background:#fff;font-size:50px;font-weight:800;text-align:center;outline:none}
.feedback{height:18%;display:flex;align-items:center;justify-content:center;font-size:62px;font-weight:900}
.good{color:#16803a} .badtext{color:#c62828}
#finish{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:84px}
#finish.show{display:flex}
@media(max-width:620px){
 #board{height:385px} .grid{padding:9px;gap:7px}
 .picbox{width:220px;height:140px} .pic{font-size:58px}
 .multi .pic{font-size:37px} .apple{font-size:28px}
 .wordrow{font-size:35px} .letter{width:58px;height:64px;font-size:42px}
}
</style>
</head>

 {type:"wordpic",word:"Lampe",choices:["Lampe","Löwe","Lupe","Maus","Apfel","Radio"]},
 {type:"wordpic",word:"Regal",choices:["Regal","Radio","Rose","Sofa","Ring","Regen"]},
 {type:"wordpic",word:"Apotheke",choices:["Apotheke","Ampel","Avocado","Ananas","Maus","Mond"]},
 {type:"wordpic",word:"Rucksack",choices:["Rucksack","Rechnung","Ring","Rose","Sofa","Maus"]},

 {type:"number",n:3},{type:"number",n:6},{type:"number",n:8},{type:"number",n:11},{type:"number",n:12},

 {type:"plural",word:"Rose",count:3,text:"drei Rosen"},

 {type:"istsind",word:"Apfel",count:1,text:"Das ___ ein Apfel."},

 {type:"type",word:"Saft",left:"S",right:"ft",answer:"a"},
 {type:"type",word:"Salz",left:"Sa",right:"z",answer:"l"},
 {type:"type",word:"Rose",left:"Ro",right:"e",answer:"s"},
 {type:"type",word:"Ring",left:"Rin",right:"",answer:"g"},
 {type:"type",word:"Reis",left:"Re",right:"s",answer:"i"},
 {type:"type",word:"Lampe",left:"L",right:"mpe",answer:"a"},
 {type:"type",word:"Löwe",left:"L",right:"we",answer:"ö"},
 {type:"type",word:"Lupe",left:"L",right:"pe",answer:"u"},
 {type:"type",word:"Maus",left:"M",right:"us",answer:"a"},
 {type:"type",word:"Milch",left:"Mi",right:"ch",answer:"l"},
 {type:"type",word:"Apfel",left:"Ap",right:"el",answer:"f"},
 {type:"type",word:"Ampel",left:"Am",right:"el",answer:"p"},

 // Tippaufgaben Farben
 {type:"typecolor",word:"rot",left:"r",right:"t",answer:"o",color:"#d52b2b"},
 {type:"typecolor",word:"blau",left:"bl",right:"u",answer:"a",color:"#2f67c8"},
 {type:"typecolor",word:"grün",left:"gr",right:"n",answer:"ü",color:"#3f9a52"},
 {type:"typecolor",word:"gelb",left:"gel",right:"",answer:"b",color:"#f2d13d"},
 {type:"typecolor",word:"weiß",left:"w",right:"iß",answer:"e",color:"#ffffff"},

 // Tippaufgaben Zahlwörter
 {type:"typenumber",word:"zwei",n:2,left:"zw",right:"i",answer:"e"},
 {type:"typenumber",word:"sechs",n:6,left:"s",right:"chs",answer:"e"},
 {type:"typenumber",word:"sieben",n:7,left:"sieb",right:"n",answer:"e"},
 {type:"typenumber",word:"zehn",n:10,left:"z",right:"hn",answer:"e"},
 {type:"typenumber",word:"zwölf",n:12,left:"zw",right:"lf",answer:"ö"}
];

var rounds=[],round=0,locked=false;

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function clearBoard(){Array.from(board.children).forEach(function(e){if(e!==finish)e.remove()})}
function showOne(container,word){
 if(img[word]){
   var im=document.createElement("img");
   im.className="realpic";
   im.alt="";
   im.src=img[word];
   im.onerror=function(){
     im.remove();
     var sp=document.createElement("span");
     sp.className="pic";
     sp.textContent=emoji[word]||"●";
     container.appendChild(sp);
   };
   container.appendChild(im);
 }else{
   var sp=document.createElement("span");
   sp.className="pic";
   sp.textContent=emoji[word]||"●";
   container.appendChild(sp);
 }
}
function showMany(container,word,count){
 var wrap=document.createElement("div");wrap.className=count>1?"multi":"";
 for(var i=0;i<count;i++)showOne(wrap,word);
 container.appendChild(wrap);
}
function markButton(b,ok,cb){
 b.classList.add(ok?"ok":"bad");b.disabled=true;
 if(ok)setTimeout(cb,520);
 else setTimeout(function(){b.classList.remove("bad");b.disabled=false},420);
}
function finishTask(){round++;bar.style.width=(round/rounds.length*100)+"%";if(round>=rounds.length){clearBoard();title.textContent="";prompt.textContent="";finish.className="show"}else render()}

function renderWordPic(t){
 title.textContent="Lies und klick.";prompt.textContent=t.word;
 var grid=document.createElement("div");grid.className="grid";
 shuffle(t.choices.slice()).forEach(function(w){var b=document.createElement("button");b.className="card";b.type="button";showOne(b,w);
 b.onclick=function(){markButton(b,w===t.word,finishTask)};grid.appendChild(b)});board.appendChild(grid);
}
function renderPicWord(t){
 title.textContent="Klick auf das Wort.";prompt.textContent="";
 var c=document.createElement("div");c.className="center";var pb=document.createElement("div");pb.className="picbox";showOne(pb,t.word);c.appendChild(pb);board.appendChild(c);
 var a=document.createElement("div");a.className="answers";
 shuffle(t.choices.slice()).forEach(function(w){var b=document.createElement("button");b.className="answer";b.textContent=w;b.onclick=function(){markButton(b,w===t.word,finishTask)};a.appendChild(b)});board.appendChild(a);
}
function renderNumber(t){
 title.textContent="Lies und zähle.";prompt.textContent=numwords[t.n];
 var nums=[t.n];var pool=[];for(var i=1;i<=12;i++)if(i!==t.n)pool.push(i);shuffle(pool);while(nums.length<4)nums.push(pool.pop());shuffle(nums);
 var grid=document.createElement("div");grid.className="grid";
 nums.forEach(function(n){var b=document.createElement("button");b.className="card";var w=document.createElement("div");w.className="apples";for(var i=0;i<n;i++){var a=document.createElement("span");a.className="apple";a.textContent="🍎";w.appendChild(a)}b.appendChild(w);b.onclick=function(){markButton(b,n===t.n,finishTask)};grid.appendChild(b)});board.appendChild(grid);
}
function renderPlural(t){
 title.textContent="Lies und klick.";
 prompt.textContent=t.text;

 var known=["Rose","Ring","Apfel","Socke","Maus"];
 var others=shuffle(known.filter(function(w){return w!==t.word}));
 var wrongCount;

 if(t.count===1) wrongCount=3;
 else if(t.count>=5) wrongCount=t.count-1;
 else wrongCount=t.count+1;

 var other1=others[0], other2=others[1];

 var candidates=[
   [t.word,t.count],        // genau eine richtige Antwort
   [t.word,wrongCount],     // richtiges Wort, falsche Anzahl
   [other1,t.count],        // falsches Wort, richtige Anzahl
   [other2,wrongCount]      // beides falsch
 ];

 var grid=document.createElement("div");
 grid.className="grid";

 shuffle(candidates).forEach(function(x){
   var b=document.createElement("button");
   b.className="card";
   b.type="button";
   showMany(b,x[0],x[1]);
   b.onclick=function(){
     markButton(b,x[0]===t.word && x[1]===t.count,finishTask);
   };
   grid.appendChild(b);
 });
 board.appendChild(grid);
}
function renderIstSind(t){
 title.textContent="Klick auf ist oder sind.";prompt.textContent="";
 var c=document.createElement("div");c.className="center";var pb=document.createElement("div");pb.className="picbox";showMany(pb,t.word,t.count);c.appendChild(pb);board.appendChild(c);
 var sentence=document.createElement("div");sentence.style.textAlign="center";sentence.style.fontSize="34px";sentence.style.fontWeight="700";sentence.style.marginTop="-8px";sentence.textContent=t.text;board.appendChild(sentence);
 var a=document.createElement("div");a.className="answers";["ist","sind"].forEach(function(w){var b=document.createElement("button");b.className="answer";b.textContent=w;b.onclick=function(){markButton(b,w===(t.count===1?"ist":"sind"),finishTask)};a.appendChild(b)});board.appendChild(a);
}
function renderType(t){
 title.textContent="Tippe den Buchstaben.";prompt.textContent="";
 var c=document.createElement("div");c.className="center";var pb=document.createElement("div");pb.className="picbox";showOne(pb,t.word);c.appendChild(pb);board.appendChild(c);
 var row=document.createElement("div");row.className="wordrow";
 var l=document.createElement("span");l.textContent=t.left;row.appendChild(l);
 var input=document.createElement("input");input.className="letter";input.maxLength=1;row.appendChild(input);
 var r=document.createElement("span");r.textContent=t.right;row.appendChild(r);board.appendChild(row);
 var fb=document.createElement("div");fb.className="feedback";board.appendChild(fb);
 input.addEventListener("input",function(){if(locked||!input.value)return;if(input.value.toLowerCase()===t.answer.toLowerCase()){locked=true;input.disabled=true;fb.textContent="✓";fb.className="feedback good";setTimeout(finishTask,600)}else{fb.textContent="✕";fb.className="feedback badtext";input.value="";setTimeout(function(){fb.textContent="";fb.className="feedback";input.focus()},420)}});
 setTimeout(function(){input.focus()},80);
}

function renderTypeColor(t){
 title.textContent="Tippe den Buchstaben.";prompt.textContent="";
 var c=document.createElement("div");c.className="center";
 var box=document.createElement("div");box.className="colorbox";box.style.background=t.color;
 if(t.word==="weiß")box.style.borderColor="#777";
 c.appendChild(box);board.appendChild(c);
 renderTypingRow(t);
}
function renderTypeNumber(t){
 title.textContent="Tippe den Buchstaben.";prompt.textContent="";
 var c=document.createElement("div");c.className="center";
 var w=document.createElement("div");w.className="apples";
 for(var i=0;i<t.n;i++){var a=document.createElement("span");a.className="apple";a.textContent="🍎";w.appendChild(a)}
 c.appendChild(w);board.appendChild(c);
 renderTypingRow(t);
}
function renderTypingRow(t){
 var row=document.createElement("div");row.className="wordrow";
 var l=document.createElement("span");l.textContent=t.left;row.appendChild(l);
 var input=document.createElement("input");input.className="letter";input.maxLength=1;row.appendChild(input);
 var r=document.createElement("span");r.textContent=t.right;row.appendChild(r);board.appendChild(row);
 var fb=document.createElement("div");fb.className="feedback";board.appendChild(fb);
 input.addEventListener("input",function(){
   if(locked||!input.value)return;
   if(input.value.toLocaleLowerCase("de-DE")===t.answer.toLocaleLowerCase("de-DE")){
     locked=true;input.disabled=true;input.value=t.answer;fb.textContent="✓";fb.className="feedback good";setTimeout(finishTask,600)
   }else{
     fb.textContent="✕";fb.className="feedback badtext";input.value="";
     setTimeout(function(){fb.textContent="";fb.className="feedback";input.focus()},420)
   }
 });
 setTimeout(function(){input.focus()},80);
}
function renderColor(t){
 title.textContent="Lies und klick.";prompt.textContent=t.text;
 var all=["rote Socken","grüner Rucksack","blaues Sofa","gelber Rock","blaue Mütze"];var grid=document.createElement("div");grid.className="grid";
 var choices=shuffle(all.slice());choices.push(shuffle(all.filter(function(x){return x!==t.text}))[0]);shuffle(choices);
 choices.forEach(function(w){var b=document.createElement("button");b.className="card";showOne(b,w);b.onclick=function(){markButton(b,w===t.text,finishTask)};grid.appendChild(b)});board.appendChild(grid);
}

function render(){
 clearBoard();finish.className="";locked=false;var t=rounds[round];
 if(t.type==="wordpic")renderWordPic(t);
 else if(t.type==="picword")renderPicWord(t);
 else if(t.type==="number")renderNumber(t);
 else if(t.type==="plural")renderPlural(t);
 else if(t.type==="istsind")renderIstSind(t);
 else if(t.type==="type")renderType(t);
 else if(t.type==="typecolor")renderTypeColor(t);
 else if(t.type==="typenumber")renderTypeNumber(t);
 else if(t.type==="color")renderColor(t);
}
function restart(){round=0;rounds=shuffle(tasks.slice());bar.style.width="0%";render()}
document.getElementById("reset").onclick=restart;restart();
})();
</script>
