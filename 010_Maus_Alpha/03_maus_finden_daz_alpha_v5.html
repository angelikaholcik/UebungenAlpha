<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Übung 3 – Wo ist die Maus?</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1e8;font-family:Arial,sans-serif;min-height:100vh}
#game{min-height:100vh;padding:14px 18px 24px}
#top{display:flex;align-items:center;gap:12px}
.ctl{width:56px;height:56px;border:0;border-radius:16px;background:#fff;font-size:28px;box-shadow:0 2px 8px rgba(0,0,0,.12);cursor:pointer}
#progress{flex:1;height:18px;background:#ddd;border-radius:12px;overflow:hidden}
#bar{height:100%;width:0;background:#444;transition:width .2s}
h1{text-align:center;font-size:clamp(34px,5vw,64px);margin:18px 0 22px;color:#222}
#field{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:900px;margin:0 auto}
.item{position:relative;min-height:170px;border:0;border-radius:28px;background:#fff;font-size:clamp(64px,9vw,100px);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.10)}
.item:active{transform:scale(.95)}
.item.wrong::after{
  content:"✕";
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#c62828;
  font-size:clamp(100px,14vw,170px);
  font-weight:900;
  line-height:1;
  background:rgba(255,255,255,.18);
  border-radius:28px;
}
.item.right::after{
  content:"✓";
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#16803a;
  font-size:clamp(90px,13vw,155px);
  font-weight:900;
  line-height:1;
  background:rgba(255,255,255,.18);
  border-radius:28px;
}
#feedback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:10;font-size:150px;font-weight:bold}#feedback.show{display:flex}#feedback.ok{color:#16803a}#feedback.no{color:#c62828}
#done{display:none;min-height:420px;align-items:center;justify-content:center;text-align:center;font-size:110px}
#done.show{display:flex}
@media(max-width:650px){
  #field{grid-template-columns:repeat(2,minmax(0,1fr))}
  .item{min-height:135px}
}
</style>
</head>
<body>
<div id="game">
  <div id="top">
    <button class="ctl" id="restart" type="button" aria-label="Neu starten">↺</button>
    <div id="progress"><div id="bar"></div></div>
    <button class="ctl" id="sound" type="button" aria-label="Ton an oder aus">🔇</button>
  </div>

  <h1>Wo ist die Maus?</h1>

  <div id="field"></div>
  <div id="done">👏 🎉</div>
</div>

<script>
(function(){
  var field=document.getElementById("field");
  var bar=document.getElementById("bar");
  var done=document.getElementById("done");
  var restart=document.getElementById("restart");
  var soundBtn=document.getElementById("sound");

  var distractors=["☕","🚌","🔑","👟","📱","🍎","🏠","🚲","🥖","🧥"];
  var round=0;
  var total=12;
  var soundOn=false;
  var audioCtx=null;

  function getAudio(){
    var A=window.AudioContext||window.webkitAudioContext;
    if(!A) return null;
    if(!audioCtx) audioCtx=new A();
    return audioCtx;
  }

  function note(freq,start,duration,volume){
    var a=getAudio();
    if(!a) return;
    var o=a.createOscillator();
    var g=a.createGain();
    o.type="sine";
    o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,start);
    g.gain.linearRampToValueAtTime(volume,start+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,start+duration);
    o.connect(g);
    g.connect(a.destination);
    o.start(start);
    o.stop(start+duration+0.02);
  }

  function pling(){
    if(!soundOn) return;
    var a=getAudio();
    if(!a) return;
    var t=a.currentTime;
    note(659.25,t,0.38,0.04);
    note(987.77,t+0.025,0.35,0.022);
  }

  function success(){
    if(!soundOn) return;
    var a=getAudio();
    if(!a) return;
    var t=a.currentTime;
    var ns=[523.25,659.25,783.99,1046.5];
    for(var i=0;i<ns.length;i++){
      note(ns[i],t+i*0.12,0.3,0.035);
    }
  }

  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var tmp=arr[i];
      arr[i]=arr[j];
      arr[j]=tmp;
    }
    return arr;
  }

  function makeButton(symbol,isMouse){
    var b=document.createElement("button");
    b.type="button";
    b.className="item";
    b.textContent=symbol;
    b.addEventListener("click",function(){
      if(isMouse){
        b.classList.add("right");
        round++;
        bar.style.width=(round/total*100)+"%";
        b.disabled=true;
        if(round>=total){
          window.setTimeout(function(){
            field.style.display="none";
            done.className="show";
          },550);
        }else{
          window.setTimeout(drawRound,550);
        }
      }else{
        b.classList.add("wrong");
        b.disabled=true;
      }
    });
    return b;
  }

  function drawRound(){
    field.innerHTML="";
    var pool=distractors.slice();
    shuffle(pool);
    var symbols=pool.slice(0,5);
    symbols.push("🐭");
    shuffle(symbols);

    for(var i=0;i<symbols.length;i++){
      field.appendChild(makeButton(symbols[i],symbols[i]==="🐭"));
    }
  }

  function resetGame(){
    round=0;
    bar.style.width="0%";
    done.className="";
    field.style.display="grid";
    drawRound();
  }

  restart.addEventListener("click",resetGame);
  soundBtn.addEventListener("click",function(){
    soundOn=!soundOn;
    soundBtn.textContent=soundOn ? "🔊" : "🔇";
  });

  resetGame();
})();
</script>
</body>
</html>
