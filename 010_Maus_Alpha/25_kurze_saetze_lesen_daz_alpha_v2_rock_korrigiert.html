<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Übung 25 – Kurze Sätze lesen</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1e8;font-family:Arial,sans-serif}
#game{padding:8px 12px 14px;min-height:100vh}
.top{display:flex;gap:10px;align-items:center}
.ctl{width:46px;height:46px;border:0;border-radius:14px;background:#fff;font-size:23px;box-shadow:0 2px 8px #bbb;cursor:pointer}
.track{flex:1;height:16px;background:#ddd;border-radius:10px;overflow:hidden}
.bar{height:100%;width:0;background:#444;transition:.2s}
#prompt{text-align:center;font-size:clamp(26px,4vw,42px);font-weight:800;margin:8px 0 10px}
#board{position:relative;max-width:900px;height:410px;margin:auto;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 2px 8px #ddd}
.grid{height:100%;padding:14px;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:12px}
.card{position:relative;border:0;border-radius:18px;background:#f3f3f3;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pics{display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:center;max-width:90%;max-height:90%}
.pic{font-size:clamp(42px,5.5vw,62px);line-height:1}.picimg{display:block;max-width:78px;max-height:92px;width:auto;height:auto;object-fit:contain}
.card.ok:after,.card.bad:after{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:900;background:rgba(255,255,255,.76)}
.card.ok:after{content:"✓";color:#16803a}
.card.bad:after{content:"✕";color:#c62828}
#finish{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:82px}
#finish.show{display:flex}
@media(max-width:600px){
 #board{height:360px}
 .grid{padding:9px;gap:8px}
 .pic{font-size:37px}
 #prompt{font-size:31px}
}
</style>
</head>

 <div id="prompt"></div>
 <div id="board"><div id="finish">👏 🎉</div></div>
</div>

var numwords={1:"ein",2:"zwei",3:"drei",4:"vier"};

var baseRounds=[
 {noun:"Rose",count:1,text:"Das ist eine Rose."},
 {noun:"Ring",count:1,text:"Das ist ein Ring."},
 {noun:"Apfel",count:4,text:"Das sind vier Äpfel."},
 {noun:"Socke",count:2,text:"Das sind zwei Socken."},
 {noun:"Rose",count:3,text:"Das sind drei Rosen."},
 {noun:"Rucksack",count:1,text:"Das ist ein Rucksack."},
 {noun:"Ring",count:3,text:"Das sind drei Ringe."},
 {noun:"Rock",count:1,text:"Das ist ein Rock."},
 {noun:"Socke",count:4,text:"Das sind vier Socken."},
 {noun:"Apfel",count:2,text:"Das sind zwei Äpfel."}
];

var rounds=[],round=0;

function shuffle(a){
 for(var i=a.length-1;i>0;i--){
  var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;
 }
 return a;
}
function clearBoard(){
 Array.from(board.children).forEach(function(e){if(e!==finish)e.remove()});
}
function picGroup(noun,count){
 var d=document.createElement("div");d.className="pics";
 for(var i=0;i<count;i++){
  if(nouns[noun].pic.indexOf("IMG:")===0){
   var im=document.createElement("img");
   im.className="picimg";
   im.src=nouns[noun].pic.slice(4);
   im.alt="";
   d.appendChild(im);
  }else{
   var s=document.createElement("span");
   s.className="pic";
   s.textContent=nouns[noun].pic;
   d.appendChild(s);
  }
 }
 return d;
}
function makeChoices(r){
 var all=Object.keys(nouns);
 var others=shuffle(all.filter(function(n){return n!==r.noun})).slice(0,2);
 var altCount=r.count===1?3:(r.count===4?3:r.count+1);
 return shuffle([
   [r.noun,r.count],
   [r.noun,altCount],
   [others[0],r.count],
   [others[1],r.count===1?2:1]
 ]);
}
function render(){
 clearBoard();finish.className="";
 var r=rounds[round];
 promptEl.textContent=r.text;

 var grid=document.createElement("div");grid.className="grid";
 makeChoices(r).forEach(function(item){
  var b=document.createElement("button");b.type="button";b.className="card";
  b.appendChild(picGroup(item[0],item[1]));
  b.onclick=function(){
   if(b.disabled)return;
   if(item[0]===r.noun && item[1]===r.count){
    b.classList.add("ok");b.disabled=true;setTimeout(next,520);
   }else{
    b.classList.add("bad");b.disabled=true;
    setTimeout(function(){b.classList.remove("bad");b.disabled=false},430);
   }
  };
  grid.appendChild(b);
 });
 board.appendChild(grid);
}
function next(){
 round++;
 bar.style.width=(round/rounds.length*100)+"%";
 if(round>=rounds.length){
  clearBoard();promptEl.textContent="Super!";finish.className="show";
 }else render();
}
function restart(){
 round=0;rounds=shuffle(baseRounds.slice());bar.style.width="0%";render();
}
document.getElementById("reset").onclick=restart;restart();
})();
