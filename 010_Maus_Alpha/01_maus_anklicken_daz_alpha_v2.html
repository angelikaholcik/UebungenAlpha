<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Übung 1 – Maus anklicken</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#f4f1e8;
  overflow:hidden;
}
#game{
  position:relative;
  width:100vw;
  height:100vh;
  min-height:520px;
}
#top{
  position:absolute;
  top:14px;
  left:14px;
  right:14px;
  display:flex;
  align-items:center;
  gap:12px;
  z-index:5;
}
#restart,#sound{
  width:56px;
  height:56px;
  border:0;
  border-radius:16px;
  background:white;
  font-size:28px;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
  cursor:pointer;
}
#progress{
  flex:1;
  height:18px;
  border-radius:12px;
  background:#ddd;
  overflow:hidden;
}
#bar{
  height:100%;
  width:0%;
  background:#3f3f3f;
  transition:width .25s;
}
#mouse{
  position:absolute;
  border:0;
  background:transparent;
  font-size:96px;
  line-height:1;
  cursor:pointer;
  padding:10px;
  transition:left .18s, top .18s, transform .12s;
}
#mouse:active{transform:scale(.88)}
#hand{
  position:absolute;
  font-size:58px;
  pointer-events:none;
  animation:point 1s ease-in-out infinite;
  opacity:.9;
}
@keyframes point{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(-10px,-8px)}
}
#finish{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:110px;
}
#finish.show{display:flex}
@media (prefers-reduced-motion:reduce){
  #hand{animation:none}
  #mouse{transition:none}
}
</style>
</head>
<body>
<div id="game">
  <div id="top">
    <button id="restart" type="button" aria-label="Neu starten">↺</button>
    <div id="progress" aria-hidden="true"><div id="bar"></div></div>
    <button id="sound" type="button" aria-label="Ton an oder aus">🔊</button>
  </div>

  <button id="mouse" type="button" aria-label="Maus">🐭</button>
  <div id="hand" aria-hidden="true">☝️</div>
  <div id="finish" aria-live="polite">👏 🎉</div>
</div>

<script>
(() => {
  const game = document.getElementById('game');
  const mouse = document.getElementById('mouse');
  const hand = document.getElementById('hand');
  const bar = document.getElementById('bar');
  const finish = document.getElementById('finish');
  const restart = document.getElementById('restart');
  const soundButton = document.getElementById('sound');

  const total = 12;
  let hits = 0;
  let soundOn = true;
  let first = true;

  let audioCtx = null;
  function ctx(){
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return null;
    if(!audioCtx) audioCtx = new AudioCtx();
    return audioCtx;
  }

  function pling(){
    if(!soundOn) return;
    const a=ctx(); if(!a) return;
    const now=a.currentTime;
    [659.25, 987.77].forEach((freq,i)=>{
      const o=a.createOscillator(), g=a.createGain();
      o.type='sine'; o.frequency.setValueAtTime(freq,now);
      g.gain.setValueAtTime(0,now);
      g.gain.linearRampToValueAtTime(i?0.025:0.045,now+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,now+0.42);
      o.connect(g); g.connect(a.destination);
      o.start(now+i*0.025); o.stop(now+0.44);
    });
  }

  function success(){
    if(!soundOn) return;
    const a=ctx(); if(!a) return;
    const now=a.currentTime;
    [523.25,659.25,783.99,1046.5].forEach((freq,i)=>{
      const o=a.createOscillator(), g=a.createGain();
      o.type='sine';
      const t=now+i*0.12;
      o.frequency.setValueAtTime(freq,t);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.04,t+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.32);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t+0.34);
    });
  }

  function placeMouse(){
    const rect = game.getBoundingClientRect();
    const size = Math.min(125, Math.max(90, rect.width * .14));
    mouse.style.fontSize = size + 'px';

    const marginX = 30;
    const marginTop = 90;
    const marginBottom = 30;
    const maxX = Math.max(marginX, rect.width - size - marginX);
    const maxY = Math.max(marginTop, rect.height - size - marginBottom);

    const x = marginX + Math.random() * Math.max(1, maxX - marginX);
    const y = marginTop + Math.random() * Math.max(1, maxY - marginTop);

    mouse.style.left = x + 'px';
    mouse.style.top = y + 'px';

    if(first){
      hand.style.left = Math.min(rect.width - 70, x + size * .7) + 'px';
      hand.style.top = Math.min(rect.height - 70, y + size * .65) + 'px';
      hand.style.display = 'block';
    }else{
      hand.style.display = 'none';
    }
  }

  function update(){
    bar.style.width = (hits / total * 100) + '%';
  }

  function hit(){
    if(hits >= total) return;
    pling();
    hits++;
    first = false;
    update();

    if(hits >= total){
      mouse.style.display = 'none';
      hand.style.display = 'none';
      finish.classList.add('show');
      success();
    }else{
      placeMouse();
    }
  }

  function reset(){
    hits = 0;
    first = true;
    update();
    finish.classList.remove('show');
    mouse.style.display = 'block';
    placeMouse();
  }

  mouse.addEventListener('click', hit);
  restart.addEventListener('click', reset);
  soundButton.addEventListener('click', () => {
    soundOn = !soundOn;
    soundButton.textContent = soundOn ? '🔊' : '🔇';
  });
  window.addEventListener('resize', () => { if(hits < total) placeMouse(); });

  reset();
})();
</script>
</body>
</html>
