<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Übung 33 – Wort lesen und Bild anklicken</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1e8;font-family:Arial,sans-serif}
#game{padding:8px 12px 14px;min-height:100vh}
.top{display:flex;gap:10px;align-items:center}
.ctl{width:46px;height:46px;border:0;border-radius:14px;background:#fff;font-size:23px;box-shadow:0 2px 8px #bbb;cursor:pointer}
.track{flex:1;height:16px;background:#ddd;border-radius:10px;overflow:hidden}
.bar{height:100%;width:0;background:#444;transition:.2s}
h1{text-align:center;font-size:clamp(24px,3.2vw,35px);margin:5px 0 4px}
#word{text-align:center;font-size:clamp(34px,5vw,52px);font-weight:800;margin:0 0 8px}
#board{position:relative;max-width:900px;height:410px;margin:auto;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 2px 8px #ddd}
.grid{height:100%;padding:14px;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:12px}
.card{position:relative;border:0;border-radius:22px;background:#f3f3f3;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px}
.card svg{width:85%;height:85%}
.pic{font-size:clamp(72px,9vw,110px);line-height:1}
.img{display:block;max-width:84%;max-height:84%;width:auto;height:auto;object-fit:contain}
.card.ok:after,.card.bad:after{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:900;background:rgba(255,255,255,.76)}
.card.ok:after{content:"✓";color:#16803a}
.card.bad:after{content:"✕";color:#c62828}
#finish{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:82px}
#finish.show{display:flex}
@media(max-width:600px){
 #board{height:360px}
 .grid{padding:10px;gap:8px}
 .pic{font-size:64px}
}
</style>
</head>
<body>
<div id="game">
 <div class="top">
  <button id="reset" class="ctl" type="button" aria-label="Neu starten">↺</button>
  <div class="track"><div id="bar" class="bar"></div></div>
 </div>
 <h1>Klick auf das Bild.</h1>
 <div id="word"></div>
 <div id="board"><div id="finish">👏 🎉</div></div>
</div>

function icon(name){
  if(name==="Nase" && IMAGES["Nase"]) return '<img class="img" src="'+IMAGES["Nase"]+'" alt="">';
  if(name==="Nudeln" && IMAGES["Nudeln"]) return '<img class="img" src="'+IMAGES["Nudeln"]+'" alt="">';
  if(name==="Esel") return '<span class="pic">🫏</span>';
  if(name==="Ente") return '<span class="pic">🦆</span>';
  if(name==="Erde") return '<span class="pic">🌍</span>';
  if(name==="Erdbeere") return '<span class="pic">🍓</span>';
  if(name==="Elefant") return '<span class="pic">🐘</span>';
  if(name==="Erbse") return '<span class="pic">🫛</span>';
  if(name==="Nest") return '<span class="pic">🪺</span>';
  if(name==="Nase") return '<span class="pic">👃</span>';
  if(name==="Nudeln") return '<span class="pic">🍝</span>';
  if(name==="Apfel") return '<span class="pic">🍎</span>';
  if(name==="Maus") return '<span class="pic">🐭</span>';
  if(name==="Ring") return '<span class="pic">💍</span>';
  if(name==="Rose") return '<span class="pic">🌹</span>';
  if(name==="Lampe") return '<span class="pic">💡</span>';
  if(name==="Löwe") return '<span class="pic">🦁</span>';
  if(name==="Milch") return '<span class="pic">🥛</span>';
  if(name==="Radio") return '<span class="pic">📻</span>';
  return '<span class="pic">●</span>';
}

var rounds = [
  {word:"Esel", choices:["Esel","Ente","Maus","Apfel"]},
  {word:"Ente", choices:["Ente","Esel","Elefant","Nest"]},
  {word:"Erde", choices:["Erde","Erdbeere","Nest","Apfel"]},
  {word:"Nest", choices:["Nest","Nase","Ring","Rose"]},
  {word:"Nase", choices:["Nase","Nest","Lampe","Radio"]},
  {word:"Nudeln", choices:["Nudeln","Milch","Apfel","Rose"]},
  {word:"Erdbeere", choices:["Erdbeere","Erbse","Erde","Ring"]},
  {word:"Elefant", choices:["Elefant","Esel","Ente","Löwe"]},
  {word:"Erbse", choices:["Erbse","Erdbeere","Apfel","Nudeln"]},
  {word:"Nase", choices:["Nase","Maus","Rose","Nest"]}
];

var round=0;

function shuffle(a){
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function clearBoard(){
  Array.from(board.children).forEach(function(e){if(e!==finish)e.remove();});
}
function render(){
  clearBoard();
  finish.className="";
  var r=rounds[round];
  wordBox.textContent=r.word;

  var grid=document.createElement("div");
  grid.className="grid";

  shuffle(r.choices.slice()).forEach(function(name){
    var b=document.createElement("button");
    b.type="button";
    b.className="card";
    b.innerHTML=icon(name);
    b.setAttribute("aria-label",name);
    b.onclick=function(){
      if(b.disabled) return;
      if(name===r.word){
        b.classList.add("ok");
        b.disabled=true;
        setTimeout(next,560);
      }else{
        b.classList.add("bad");
        b.disabled=true;
        setTimeout(function(){
          b.classList.remove("bad");
          b.disabled=false;
        },430);
      }
    };
    grid.appendChild(b);
  });

  board.appendChild(grid);
}
function next(){
  round++;
  bar.style.width=(round/rounds.length*100)+"%";
  if(round>=rounds.length){
    clearBoard();
    wordBox.textContent="Super!";
    finish.className="show";
  } else render();
}
function restart(){
  round=0;
  bar.style.width="0%";
  render();
}
document.getElementById("reset").onclick=restart;
restart();
})();
</script>
