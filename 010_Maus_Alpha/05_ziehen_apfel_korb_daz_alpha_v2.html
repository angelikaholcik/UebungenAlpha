<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Übung 5 – Ziehen</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f1e8;font-family:Arial,sans-serif;min-height:100vh;overflow:hidden}#game{min-height:100vh;padding:14px 18px 24px}.top{display:flex;gap:12px;align-items:center}.ctl{width:56px;height:56px;border:0;border-radius:16px;background:#fff;font-size:28px;box-shadow:0 2px 8px #bbb}.track{flex:1;height:18px;background:#ddd;border-radius:12px;overflow:hidden}.bar{height:100%;width:0;background:#444;transition:width .25s}h1{text-align:center;font-size:clamp(36px,5vw,62px);margin:16px 0 18px}#field{position:relative;max-width:950px;height:520px;margin:auto;background:#fff;border-radius:30px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden}#apple{position:absolute;cursor:grab;user-select:none;touch-action:none;z-index:4;line-height:1}#apple.dragging{cursor:grabbing}#basket{position:absolute;border:6px dashed #888;border-radius:28px;display:flex;align-items:center;justify-content:center;line-height:1}#hint{position:absolute;font-size:58px;pointer-events:none;z-index:3;animation:hint 1.3s infinite}@keyframes hint{50%{transform:translateX(65px)}}#check{position:absolute;display:none;align-items:center;justify-content:center;color:#16803a;font-size:140px;font-weight:900;z-index:8;pointer-events:none}#check.on{display:flex}@media(prefers-reduced-motion:reduce){#hint{animation:none}}</style></head>
<body><div id="game"><div class="top"><button class="ctl" id="reset">↺</button><div class="track"><div class="bar" id="bar"></div></div></div><h1>Zieh den Apfel in den Korb.</h1><div id="field"><div id="apple">🍎</div><div id="basket">🧺</div><div id="hint">☝️ ➜</div><div id="check">✓</div></div></div>
<script>
(function(){
var apple=document.getElementById("apple"),basket=document.getElementById("basket"),field=document.getElementById("field"),hint=document.getElementById("hint"),check=document.getElementById("check"),bar=document.getElementById("bar"),reset=document.getElementById("reset");
var round=0,total=8,drag=false,dx=0,dy=0,locked=false,startX=0,startY=0;
var levels=[
 {a:130,b:280,near:true},{a:125,b:270,near:true},
 {a:112,b:240,near:false},{a:105,b:225,near:false},
 {a:94,b:205,near:false},{a:88,b:190,near:false},
 {a:80,b:175,near:false},{a:74,b:165,near:false}
];
function setup(){
 locked=false;drag=false;check.className="";
 var L=levels[round],f=field.getBoundingClientRect(),leftSide=round%2===0;
 apple.style.fontSize=L.a+"px";basket.style.width=L.b+"px";basket.style.height=Math.round(L.b*.78)+"px";basket.style.fontSize=Math.round(L.b*.48)+"px";
 var ax=leftSide?55:f.width-L.a-70, ay=70+Math.random()*Math.max(20,f.height-L.a-150);
 var bx;
 if(L.near) bx=leftSide?Math.min(f.width-L.b-30,ax+L.a+100):Math.max(30,ax-L.b-100);
 else bx=leftSide?f.width-L.b-45:45;
 var by=80+Math.random()*Math.max(20,f.height-L.b*.78-150);
 startX=ax;startY=ay;apple.style.left=ax+"px";apple.style.top=ay+"px";basket.style.left=bx+"px";basket.style.top=by+"px";
 if(round<2){hint.style.display="block";hint.style.left=(leftSide?ax+L.a*.65:Math.max(20,ax-90))+"px";hint.style.top=(ay+L.a*.25)+"px"}else hint.style.display="none";
}
function down(e){if(locked)return;drag=true;hint.style.display="none";apple.classList.add("dragging");var r=apple.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;try{apple.setPointerCapture(e.pointerId)}catch(x){}}
function move(e){if(!drag||locked)return;var f=field.getBoundingClientRect(),a=apple.getBoundingClientRect();var x=e.clientX-f.left-dx,y=e.clientY-f.top-dy;x=Math.max(0,Math.min(x,f.width-a.width));y=Math.max(0,Math.min(y,f.height-a.height));apple.style.left=x+"px";apple.style.top=y+"px"}
function up(){if(!drag||locked)return;drag=false;apple.classList.remove("dragging");var a=apple.getBoundingClientRect(),b=basket.getBoundingClientRect(),cx=a.left+a.width/2,cy=a.top+a.height/2;if(cx>b.left&&cx<b.right&&cy>b.top&&cy<b.bottom){locked=true;check.style.left=basket.offsetLeft+"px";check.style.top=basket.offsetTop+"px";check.style.width=basket.offsetWidth+"px";check.style.height=basket.offsetHeight+"px";check.className="on";bar.style.width=((round+1)/total*100)+"%";setTimeout(function(){round++;if(round>=total){apple.style.display="none";basket.style.display="none";hint.style.display="none";check.style.left="0";check.style.top="0";check.style.width="100%";check.style.height="100%";check.innerHTML="👏 🎉";check.className="on"}else setup()},650)}else{apple.style.transition="left .25s, top .25s";apple.style.left=startX+"px";apple.style.top=startY+"px";setTimeout(function(){apple.style.transition=""},270)}}
function restart(){round=0;bar.style.width="0%";apple.style.display="block";basket.style.display="flex";check.innerHTML="✓";setup()}
apple.addEventListener("pointerdown",down);apple.addEventListener("pointermove",move);apple.addEventListener("pointerup",up);apple.addEventListener("pointercancel",up);reset.addEventListener("click",restart);window.addEventListener("resize",function(){if(!locked)setup()});restart();
})();</script></body></html>
