<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Übung 23 – ist oder sind</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1e8;font-family:Arial,sans-serif}
#game{padding:8px 12px 14px;min-height:100vh}
.top{display:flex;gap:10px;align-items:center}
.ctl{width:46px;height:46px;border:0;border-radius:14px;background:#fff;font-size:23px;box-shadow:0 2px 8px #bbb;cursor:pointer}
.track{flex:1;height:16px;background:#ddd;border-radius:10px;overflow:hidden}
.bar{height:100%;width:0;background:#444;transition:.2s}
h1{text-align:center;font-size:clamp(24px,3vw,34px);margin:5px 0 7px}
#board{position:relative;max-width:900px;height:390px;margin:auto;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 2px 8px #ddd}
.picture{height:47%;display:flex;align-items:center;justify-content:center;padding:12px}
.pics{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;max-width:88%}
.pic{font-size:clamp(54px,7vw,76px);line-height:1}
.sentence{text-align:center;font-size:clamp(28px,4vw,44px);font-weight:700;margin:0 10px 12px}
.answers{display:flex;gap:18px;justify-content:center;padding:0 16px}
.answer{position:relative;width:min(280px,42%);height:90px;border:0;border-radius:20px;background:#f3f3f3;font-size:clamp(30px,4vw,42px);font-weight:800;cursor:pointer}
.answer.ok:after,.answer.bad:after{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:62px;font-weight:900;background:rgba(255,255,255,.78);border-radius:20px}
.answer.ok:after{content:"✓";color:#16803a}
.answer.bad:after{content:"✕";color:#c62828}
#finish{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:82px}
#finish.show{display:flex}
@media(max-width:600px){
 #board{height:350px}
 .pic{font-size:48px}
 .answer{height:78px}
 .sentence{font-size:30px}
}
</style>
</head>
<body>
<div id="game">
  <div class="top">
    <button id="reset" class="ctl" type="button">↺</button>
    <div class="track"><div id="bar" class="bar"></div></div>
  </div>
  <h1>ist oder sind?</h1>
  <div id="board"><div id="finish">👏 🎉</div></div>
</div>

<script>
(function(){
var board=document.getElementById("board"),
    bar=document.getElementById("bar"),
    finish=document.getElementById("finish");

var nouns={
  Rose:{sg:"eine Rose",pl:"Rosen",pic:"🌹"},
  Ring:{sg:"ein Ring",pl:"Ringe",pic:"💍"},
  Apfel:{sg:"ein Apfel",pl:"Äpfel",pic:"🍎"},
  Maus:{sg:"eine Maus",pl:"Mäuse",pic:"🐭"},
  Socke:{sg:"eine Socke",pl:"Socken",pic:"🧦"},
  Sofa:{sg:"ein Sofa",pl:"Sofas",pic:"🛋️"}
};

var baseRounds=[
  ["Rose",1],["Rose",3],
  ["Ring",1],["Ring",3],
  ["Apfel",1],["Apfel",3],
  ["Maus",1],["Maus",3],
  ["Socke",1],["Socke",3],
  ["Sofa",1],["Sofa",3]
];

var rounds=[],round=0;

function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

function clearBoard(){
  Array.from(board.children).forEach(function(e){if(e!==finish)e.remove()});
}

function makePics(noun,count){
  var wrap=document.createElement("div");
  wrap.className="pics";
  for(var i=0;i<count;i++){
    var s=document.createElement("span");
    s.className="pic";
    s.textContent=nouns[noun].pic;
    wrap.appendChild(s);
  }
  return wrap;
}

function render(){
  clearBoard();
  finish.className="";
  var r=rounds[round], noun=r[0], count=r[1], answer=count===1?"ist":"sind";

  var picArea=document.createElement("div");
  picArea.className="picture";
  picArea.appendChild(makePics(noun,count));
  board.appendChild(picArea);

  var sentence=document.createElement("div");
  sentence.className="sentence";
  sentence.textContent="Das ___ "+(count===1?nouns[noun].sg:nouns[noun].pl)+".";
  board.appendChild(sentence);

  var answers=document.createElement("div");
  answers.className="answers";

  ["ist","sind"].forEach(function(word){
    var b=document.createElement("button");
    b.type="button";
    b.className="answer";
    b.textContent=word;

    b.onclick=function(){
      if(b.disabled)return;
      if(word===answer){
        b.classList.add("ok");
        b.disabled=true;
        setTimeout(next,520);
      }else{
        b.classList.add("bad");
        b.disabled=true;
        setTimeout(function(){
          b.classList.remove("bad");
          b.disabled=false;
        },430);
      }
    };

    answers.appendChild(b);
  });

  board.appendChild(answers);
}

function next(){
  round++;
  bar.style.width=(round/rounds.length*100)+"%";
  if(round>=rounds.length){
    clearBoard();
    finish.className="show";
  }else render();
}

function restart(){
  round=0;
  rounds=shuffle(baseRounds.slice());
  bar.style.width="0%";
  render();
}

document.getElementById("reset").onclick=restart;
restart();
})();
</script>
</body>
</html>
