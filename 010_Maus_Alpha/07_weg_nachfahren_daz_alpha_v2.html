<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Übung 7 – Weg nachfahren</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f4f1e8;
  font-family:Arial,sans-serif;
  overflow:hidden;
}
#game{
  min-height:100vh;
  padding:14px 18px 22px;
}
.top{
  display:flex;
  gap:12px;
  align-items:center;
}
.ctl{
  width:56px;
  height:56px;
  border:0;
  border-radius:16px;
  background:#fff;
  font-size:28px;
  box-shadow:0 2px 8px #bbb;
  cursor:pointer;
}
.track{
  flex:1;
  height:18px;
  background:#ddd;
  border-radius:12px;
  overflow:hidden;
}
.bar{
  height:100%;
  width:0;
  background:#444;
  transition:width .2s;
}
h1{
  text-align:center;
  font-size:clamp(34px,5vw,58px);
  margin:14px 0;
}
#board{
  position:relative;
  max-width:980px;
  height:540px;
  margin:auto;
  background:#fff;
  border-radius:30px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.10);
}
.dot{
  position:absolute;
  border-radius:50%;
  background:#e3e3e3;
  transform:translate(-50%,-50%);
  pointer-events:auto;
  transition:background .12s, transform .12s;
}
.dot.active{
  background:#8f8f8f;
  transform:translate(-50%,-50%) scale(1.06);
}
.dot.done{
  background:#c8c8c8;
}
#start,#goal{
  position:absolute;
  transform:translate(-50%,-50%);
  font-size:82px;
  pointer-events:none;
  z-index:8;
}
#check{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:145px;
  font-weight:900;
  color:#16803a;
  pointer-events:none;
  z-index:12;
}
#check.on{display:flex}
</style>
</head>
<body>
<div id="game">
  <div class="top">
    <button id="reset" class="ctl" type="button" aria-label="Neu starten">↺</button>
    <div class="track"><div id="bar" class="bar"></div></div>
  </div>

  <h1>Fahr den Weg nach.</h1>

  <div id="board">
    <div id="start">🐭</div>
    <div id="goal">🧀</div>
    <div id="check">✓</div>
  </div>
</div>

<script>
(function(){
  var board=document.getElementById("board");
  var start=document.getElementById("start");
  var goal=document.getElementById("goal");
  var check=document.getElementById("check");
  var bar=document.getElementById("bar");
  var reset=document.getElementById("reset");

  var routes=[
    [[10,50],[20,50],[30,50],[40,50],[50,50],[60,50],[70,50],[80,50],[90,50]],
    [[10,25],[20,30],[30,35],[40,40],[50,45],[60,50],[70,55],[80,60],[90,65]],
    [[10,55],[20,38],[30,27],[40,22],[50,24],[60,31],[70,42],[80,53],[90,55]],
    [[10,50],[18,32],[27,25],[36,39],[45,58],[54,70],[63,58],[72,39],[81,25],[90,38]],
    [[10,72],[18,52],[26,30],[36,20],[46,32],[54,55],[62,73],[72,78],[82,62],[90,35]],
    [[10,22],[22,22],[34,22],[46,22],[50,34],[50,48],[50,62],[58,76],[72,76],[90,76]],
    [[10,72],[18,48],[26,27],[36,22],[45,40],[52,62],[61,75],[70,60],[78,38],[86,25],[90,25]]
  ];

  var round=0;
  var currentIndex=0;
  var dots=[];

  function clearDots(){
    for(var i=0;i<dots.length;i++){
      if(dots[i] && dots[i].parentNode){
        dots[i].parentNode.removeChild(dots[i]);
      }
    }
    dots=[];
  }

  function buildRoute(){
    clearDots();
    check.className="";
    currentIndex=0;

    var route=routes[round];
    var size=Math.max(54, 92-round*5);

    for(var i=0;i<route.length;i++){
      var d=document.createElement("div");
      d.className="dot";
      d.style.width=size+"px";
      d.style.height=size+"px";
      d.style.left=route[i][0]+"%";
      d.style.top=route[i][1]+"%";
      d.dataset.index=i;

      (function(index,el){
        el.addEventListener("mouseenter",function(){
          visit(index);
        });
      })(i,d);

      board.appendChild(d);
      dots.push(d);
    }

    start.style.left=route[0][0]+"%";
    start.style.top=route[0][1]+"%";
    goal.style.left=route[route.length-1][0]+"%";
    goal.style.top=route[route.length-1][1]+"%";

    dots[0].classList.add("active");
  }

  function visit(index){
    if(index===currentIndex || index===currentIndex+1){
      if(index===currentIndex+1){
        dots[currentIndex].classList.remove("active");
        dots[currentIndex].classList.add("done");
        currentIndex=index;
        dots[currentIndex].classList.add("active");
      }

      if(currentIndex===dots.length-1){
        dots[currentIndex].classList.remove("active");
        dots[currentIndex].classList.add("done");
        check.className="on";
        bar.style.width=((round+1)/routes.length*100)+"%";

        setTimeout(function(){
          round++;
          if(round>=routes.length){
            clearDots();
            start.style.display="none";
            goal.style.display="none";
            check.textContent="👏 🎉";
            check.className="on";
          }else{
            buildRoute();
          }
        },700);
      }
    }
  }

  function restart(){
    round=0;
    bar.style.width="0%";
    start.style.display="";
    goal.style.display="";
    check.textContent="✓";
    buildRoute();
  }

  reset.addEventListener("click",restart);
  restart();
})();
</script>
</body>
</html>
